<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Undangan Pernikahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* =====================================================================
   ADMIN PANEL — editorial-wedding, mobile-first
   Tipografi: Fraunces (display, judul) + Plus Jakarta Sans (UI/body).
   Palet hangat netral di-tint ke arah sage; kontras dijaga di seluruh UI.
   ===================================================================== */
:root{
  --bg:#f2efe7;
  --bg-2:#e9e4d8;
  --card:#fdfcf8;
  --card-2:#f7f4ec;
  --ink:#2b2a24;
  --ink-soft:#5f5b50;
  --line:#e2dccd;
  --line-strong:#cfc7b3;
  --sage:#5f7250;
  --sage-l:#84986f;
  --sage-ink:#3f4d35;
  --gold:#b08d47;
  --red:#b0503a;
  --amber:#9a7326;
  --shadow-sm:0 1px 2px rgba(48,42,28,.06);
  --shadow:0 10px 30px -18px rgba(48,42,28,.5);
  --radius:16px;
  --radius-sm:11px;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
input,textarea,select{color:var(--ink)}
:focus-visible{outline:2.5px solid var(--sage-l);outline-offset:2px}
.hidden{display:none!important}

/* ---------- AUTH (login) ---------- */
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:22px;
  background:radial-gradient(120% 80% at 50% 0%,var(--card-2),var(--bg) 70%)}
.login-box{background:var(--card);padding:clamp(28px,6vw,40px) clamp(22px,6vw,34px);border-radius:var(--radius);
  box-shadow:var(--shadow);border:1px solid var(--line);width:100%;max-width:392px}
.login-mark{font-family:var(--serif);font-size:1.75rem;font-weight:500;letter-spacing:-.01em;line-height:1.1;margin-bottom:4px}
.login-box p.lead{color:var(--ink-soft);font-size:.87rem;margin-bottom:24px}
.field-label{display:block;font-size:.76rem;font-weight:600;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:7px}
.pw-wrap{position:relative;margin-bottom:0}
.pw-wrap input{width:100%;padding:13px 46px 13px 15px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:.95rem;background:var(--card-2);transition:border-color .18s,background .18s}
.pw-wrap input:focus{outline:none;border-color:var(--sage);background:var(--card)}
.pw-toggle{position:absolute;top:0;right:0;height:100%;width:46px;display:grid;place-items:center;border:none;
  background:transparent;color:var(--ink-soft);cursor:pointer;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.pw-toggle:hover{color:var(--sage)}
.pw-toggle svg{width:20px;height:20px}
.login-box input{width:100%;padding:13px 15px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:.95rem;background:var(--card-2);transition:border-color .18s,background .18s}
.login-box input:focus{outline:none;border-color:var(--sage);background:var(--card)}
.btn{width:100%;min-height:48px;padding:13px;border:none;border-radius:var(--radius-sm);background:var(--sage);color:#fbfaf5;
  font-weight:600;font-size:.95rem;letter-spacing:.01em;transition:background .2s,transform .12s;margin-top:16px}
.btn:hover{background:var(--sage-ink)}
.btn:active{transform:scale(.99)}
.err{color:var(--red);font-size:.84rem;margin-top:12px;min-height:1.1em}

/* ---------- TOPBAR ---------- */
.topbar{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:13px clamp(14px,4vw,26px);display:flex;justify-content:space-between;
  align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.topbar .brand{min-width:0}
.topbar h1{font-family:var(--serif);font-size:1.12rem;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:.76rem;color:var(--ink-soft);font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .actions{display:flex;gap:8px;align-items:center;flex:none}
.btn-ghost{min-height:40px;padding:9px 15px;border:1.5px solid var(--line-strong);background:var(--card);border-radius:999px;
  font-size:.8rem;font-weight:600;color:var(--ink-soft);white-space:nowrap;transition:border-color .18s,color .18s,background .18s}
.btn-ghost:hover{border-color:var(--sage);color:var(--sage);background:var(--card-2)}

.wrap{max-width:980px;margin:0 auto;padding:clamp(18px,4vw,28px) clamp(14px,4vw,22px) 72px}

/* ---------- LIVE / STATS ---------- */
.stats-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--ink-soft);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--sage-l);animation:pulse 1.6s ease-in-out infinite}
.live.off .dot{background:var(--line-strong);animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-soft);font-weight:500;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--sage);width:16px;height:16px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.55}
.stat .n{font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.15rem);font-weight:500;color:var(--sage-ink);line-height:1;letter-spacing:-.02em}
.stat .l{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-top:7px;font-weight:600}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:4px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:11px 15px;border:none;background:transparent;font-size:.86rem;font-weight:600;
  color:var(--ink-soft);white-space:nowrap;border-radius:9px 9px 0 0;transition:color .18s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--sage-ink)}
.tab.active::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2.5px;background:var(--sage);border-radius:3px}

.panel{display:none;animation:panelIn .32s var(--ease) both}
.panel.active{display:block}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- CARD ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(18px,4.5vw,26px);
  box-shadow:var(--shadow-sm);margin-bottom:16px}
.card h2{font-family:var(--serif);font-size:clamp(1.05rem,4.4vw,1.28rem);font-weight:500;letter-spacing:-.01em;margin-bottom:4px}
.card>.hint:first-of-type{margin-top:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-head h2{margin-bottom:0}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--ink-soft);margin-top:6px;line-height:1.5}

/* ---------- BUTTONS ---------- */
.btn-sm{min-height:44px;padding:11px 22px;border:none;border-radius:var(--radius-sm);background:var(--sage);color:#fbfaf5;
  font-weight:600;font-size:.88rem;transition:background .18s,transform .12s}
.btn-sm:hover{background:var(--sage-ink)}
.btn-sm:active{transform:scale(.99)}
.btn-sm.ghost{background:transparent;color:var(--sage-ink);border:1.5px solid var(--line-strong)}
.btn-sm.ghost:hover{background:var(--card-2);border-color:var(--sage)}
.btn-export{min-height:40px;padding:9px 15px;border:1.5px solid var(--line-strong);background:var(--card-2);color:var(--ink-soft);
  border-radius:999px;font-size:.78rem;font-weight:600;transition:all .18s}
.btn-export:hover{border-color:var(--sage);color:var(--sage);background:var(--card)}
.btn-del{min-height:38px;padding:8px 13px;border:1.5px solid color-mix(in srgb,var(--red) 40%,var(--line));background:transparent;
  border-radius:9px;font-size:.76rem;color:var(--red);font-weight:600;transition:background .18s,border-color .18s}
.btn-del:hover{background:color-mix(in srgb,var(--red) 9%,transparent);border-color:var(--red)}
.btn-copy-sm{min-height:38px;padding:8px 13px;border:1.5px solid var(--line-strong);background:var(--card-2);border-radius:9px;
  font-size:.76rem;color:var(--sage-ink);font-weight:600;transition:background .18s}
.btn-copy-sm:hover{background:color-mix(in srgb,var(--sage) 10%,var(--card-2))}
.link-out{color:var(--sage-ink);text-decoration:none;font-weight:600;font-size:.8rem;border-bottom:1px solid color-mix(in srgb,var(--sage) 45%,transparent);padding-bottom:1px}
.link-out:hover{border-bottom-color:var(--sage)}

/* ---------- TABLES ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:.87rem}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:700;
  border-bottom:1.5px solid var(--line-strong)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:color-mix(in srgb,var(--sage) 4%,transparent)}
td.wrap-cell{max-width:280px;color:var(--ink-soft)}
.cell-phone{font-size:.76rem;color:var(--ink-soft)}
.cell-actions{display:flex;gap:6px;flex-wrap:wrap}

.badge{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.01em}
.badge.hadir{background:color-mix(in srgb,var(--sage) 15%,transparent);color:var(--sage-ink)}
.badge.tidak_hadir{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.badge.ragu{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--amber)}
.badge.none{background:var(--bg-2);color:var(--ink-soft)}

/* ---------- FORMS ---------- */
.row-form{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px}
.row-form input,.row-form select{padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:.9rem;background:var(--card-2);transition:border-color .18s,background .18s;min-height:46px}
.row-form input:focus,.row-form select:focus{outline:none;border-color:var(--sage);background:var(--card)}
.row-form .btn-sm{width:100%}

.form-grid{display:grid;grid-template-columns:1fr;gap:15px}
.field.full{grid-column:1/-1}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--line-strong);
  border-radius:var(--radius-sm);font-size:.9rem;background:var(--card-2);transition:border-color .18s,background .18s;min-height:46px}
.field textarea{min-height:80px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sage);background:var(--card)}
.field label{display:block;font-size:.78rem;font-weight:600;margin-bottom:7px;color:var(--ink-soft);letter-spacing:.01em}

/* ---------- THEME PICKER ---------- */
.theme-picker{display:grid;grid-template-columns:1fr;gap:10px}
.theme-opt{position:relative;display:flex;align-items:center;gap:14px;padding:14px;border:1.5px solid var(--line);
  border-radius:var(--radius);cursor:pointer;background:var(--card-2);transition:border-color .18s,background .18s,transform .12s}
.theme-opt input{position:absolute;opacity:0;width:1px;height:1px}
.theme-opt:hover{border-color:var(--sage-l)}
.theme-opt:has(input:checked){border-color:var(--sage);background:color-mix(in srgb,var(--sage) 8%,var(--card));box-shadow:0 8px 22px -16px var(--sage-ink)}
.theme-opt:active{transform:scale(.995)}
.theme-opt:has(input:checked)::after{content:'✓';position:absolute;top:10px;right:12px;width:20px;height:20px;
  display:grid;place-items:center;border-radius:50%;background:var(--sage);color:#fff;font-size:.7rem;font-weight:800}
.theme-swatch{flex:none;width:46px;height:46px;border-radius:11px;border:1px solid rgba(0,0,0,.09);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.swatch-botanical{background:linear-gradient(135deg,#7d8f6d 0 50%,#b08d47 50% 100%)}
.swatch-midnight{background:linear-gradient(135deg,#14131a 0 50%,#d8b978 50% 100%)}
.swatch-blush{background:linear-gradient(135deg,#fffafa 0 50%,#c98a86 50% 100%)}
.swatch-javanese{background:linear-gradient(135deg,#8a6d3b 0 50%,#b07d2b 50% 100%)}
.swatch-minimal{background:linear-gradient(135deg,#3f3f46 0 50%,#e4e4e7 50% 100%)}
.swatch-baroque{background:linear-gradient(135deg,#6d4b6b 0 50%,#a9852f 50% 100%)}
.theme-meta{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.theme-meta strong{font-size:.92rem;font-weight:600}
.theme-meta small{font-size:.75rem;color:var(--ink-soft)}

/* ---------- SECTION DIVIDER ---------- */
.subhead{display:flex;align-items:center;gap:12px;margin:28px 0 16px}
.subhead h3{font-family:var(--serif);font-size:1.08rem;font-weight:500;white-space:nowrap}
.subhead::after{content:'';flex:1;height:1px;background:var(--line)}

/* ---------- CUSTOMIZER ---------- */
.customizer{margin-top:6px}
.cz-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.cz-grid .field label{font-size:.74rem}
.cz-grid .field.full{grid-column:1/-1}
.cz-grid input[type=color]{width:100%;height:46px;padding:4px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
  background:var(--card-2);cursor:pointer}
.cz-grid select{width:100%;padding:11px 12px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:.86rem;background:var(--card-2);min-height:46px}
.cz-swatch-row{display:flex;align-items:center;gap:10px}
.cz-swatch-row input[type=color]{flex:1}
.cz-contrast{grid-column:1/-1;display:flex;align-items:center;gap:9px;font-size:.78rem;font-weight:600;
  padding:10px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--line)}
.cz-contrast.ok{background:color-mix(in srgb,var(--sage) 10%,transparent);color:var(--sage-ink);border-color:color-mix(in srgb,var(--sage) 35%,transparent)}
.cz-contrast.warn{background:color-mix(in srgb,var(--amber) 14%,transparent);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.cz-contrast.bad{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.cz-contrast .sw{width:16px;height:16px;border-radius:5px;border:1px solid rgba(0,0,0,.15);flex:none}
.cz-preview{margin-top:16px;border:1.5px solid var(--line);border-radius:var(--radius);padding:26px 20px;text-align:center;
  background:var(--card-2);transition:background .2s,color .2s}
.cz-pv-script{display:block;font-family:'Great Vibes',cursive;font-size:clamp(1.9rem,8vw,2.5rem);line-height:1.1;transition:font-family .2s}
.cz-pv-serif{display:block;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;opacity:.7;margin-top:8px;transition:font-family .2s}
.cz-actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}
.cz-actions input{flex:1;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:.9rem;background:var(--card-2);min-height:46px}
.cz-actions input:focus{outline:none;border-color:var(--sage);background:var(--card)}
.cz-actions .btn-sm{width:100%}

/* ---------- CUSTOM THEME LIST ---------- */
.custom-themes{display:grid;grid-template-columns:1fr;gap:12px;margin-top:18px}
.ct-item{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:var(--radius);background:var(--card-2)}
.ct-item.active{border-color:var(--sage);background:color-mix(in srgb,var(--sage) 8%,var(--card))}
.ct-item.active::before{content:'Dipakai';position:absolute;top:-9px;left:14px;background:var(--sage);color:#fbfaf5;
  font-size:.62rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:999px}
.ct-swatch{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid rgba(0,0,0,.09)}
.ct-meta{display:flex;flex-direction:column;line-height:1.3;min-width:0;flex:1}
.ct-meta strong{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-meta small{font-size:.72rem;color:var(--ink-soft)}
.ct-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ct-btn{min-height:34px;padding:5px 12px;border:1.5px solid var(--line-strong);background:var(--card);border-radius:8px;
  font-size:.72rem;font-weight:600;color:var(--ink-soft);transition:all .16s}
.ct-btn.use{color:var(--sage-ink);border-color:color-mix(in srgb,var(--sage) 50%,var(--line));}
.ct-btn.use:hover{background:color-mix(in srgb,var(--sage) 12%,var(--card))}
.ct-btn.del{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.ct-btn.del:hover{background:color-mix(in srgb,var(--red) 8%,transparent)}

/* ---------- UPLOAD / MEDIA ---------- */
.media-row{display:flex;gap:8px;align-items:stretch}
.media-row input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
  font-size:.9rem;background:var(--card-2);min-height:46px}
.media-row input:focus{outline:none;border-color:var(--sage);background:var(--card)}
.btn-upload{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;
  border-radius:var(--radius-sm);background:var(--sage);color:#fbfaf5;font-weight:600;font-size:.84rem;cursor:pointer;
  white-space:nowrap;transition:background .18s}
.btn-upload:hover{background:var(--sage-ink)}
.btn-upload.busy{opacity:.55;pointer-events:none}
.bg-thumb{margin-top:10px;width:100%;max-width:280px;aspect-ratio:16/10;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  background:var(--card-2) center/cover no-repeat;display:none}
.bg-thumb.show{display:block}

/* ---------- TOAST & EMPTY ---------- */
.empty{text-align:center;color:var(--ink-soft);padding:34px 20px;font-size:.88rem;
  border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--card-2)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(90px);
  background:var(--sage-ink);color:#fbfaf5;padding:13px 24px;border-radius:999px;font-size:.86rem;font-weight:500;
  opacity:0;transition:all .35s var(--ease);z-index:200;box-shadow:0 18px 40px -18px rgba(0,0,0,.6);max-width:calc(100vw - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.sticky-save{position:sticky;bottom:12px;margin-top:8px;z-index:5}
.sticky-save .btn-sm{width:100%;box-shadow:0 12px 30px -14px var(--sage-ink)}

/* ---------- RESPONSIVE ---------- */
@media (min-width:560px){
  .row-form{grid-template-columns:1fr 1fr auto;align-items:center}
  .row-form .btn-sm{width:auto}
  .theme-picker{grid-template-columns:repeat(2,1fr)}
  .cz-actions{grid-template-columns:1fr auto}
  .cz-actions .btn-sm{width:auto}
  .custom-themes{grid-template-columns:repeat(2,1fr)}
}
@media (min-width:760px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .form-grid{grid-template-columns:repeat(2,1fr);gap:16px}
  .theme-picker{grid-template-columns:repeat(2,1fr)}
  .cz-grid{grid-template-columns:repeat(3,1fr)}
  .row-form{grid-template-columns:1.6fr 1fr .9fr .6fr auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="login-box">
    <div class="login-mark">Undangan Pernikahan</div>

<div class="toast" id="toast"></div>

<div id="fatalError" style="display:none;position:fixed;inset:auto 12px 12px 12px;z-index:300;background:#fff;border:1.5px solid var(--red);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)">
  <strong style="font-family:var(--serif);font-size:1.05rem">Terjadi kesalahan pada halaman ini</strong>
  <p class="hint" id="fatalErrorMsg" style="margin-top:4px"></p>
  <button class="btn-sm" onclick="location.reload()" style="margin-top:10px">Muat ulang halaman</button>
</div>

<script>
const $ = (s) => document.querySelector(s);
let PW = sessionStorage.getItem('wedding_admin_pw') || '';

/* Slug undangan ini, diambil dari URL /u/<slug>/admin. */
const SLUG = (() => {
  const m = location.pathname.match(/^\/u\/([^/]+)/);
  return m ? decodeURIComponent(m[1]) : '';
})();

const toast = (msg) => {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
};

async function api(url, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-admin-password': PW, 'x-account': SLUG }, opts.headers);
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Gagal'); e.status = res.status; throw e; }
  return data;
}

const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';

/* Jaring pengaman: bila ada error JS tak terduga, jangan biarkan halaman
   tampak kosong. Tampilkan pesan yang bisa dibaca & tombol muat ulang. */
window.addEventListener('error', (e) => {
  const box = document.getElementById('fatalError');
  if (!box) return;
  box.style.display = 'block';
  const d = document.getElementById('fatalErrorMsg');
  if (d) d.textContent = (e && e.message) ? e.message : 'Terjadi kesalahan tak terduga.';
});

/* ---------- LOGIN ---------- */
async function tryLogin(pw) {
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-account': SLUG },
    body: JSON.stringify({ password: pw }),
  });
  return res.ok;
}

$('#loginBtn').addEventListener('click', doLogin);
$('#pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('#pwToggle').addEventListener('click', () => {
  const i = $('#pw');
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  $('#pwToggle').setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
});

async function doLogin() {
  const pw = $('#pw').value;
  if (!pw) return;
  const ok = await tryLogin(pw);
  if (ok) {
    PW = pw;
    sessionStorage.setItem('wedding_admin_pw', pw);
    enterDashboard();
  } else {
    $('#loginErr').textContent = 'Password salah.';
  }
}

/* ---------- DASHBOARD ---------- */
let liveTimer = null;
let dashBound = false;

/**
 * Suntikkan markup dashboard ke DOM (dari <template> yang inert) lalu pasang
 * event-nya. Dipanggil HANYA setelah login berhasil, sehingga sebelum
 * autentikasi tidak ada struktur dashboard sama sekali di DOM (aman dari
 * Inspect Element / sumber tampilan).
 */
function enterDashboard() {
  const login = $('#loginView');
  if (login) login.remove();
  if (!dashBound) {
    const app = $('#app');
    const tpl = $('#dashTemplate');
    if (app && tpl && !$('#dashView')) app.appendChild(tpl.content.cloneNode(true));
    bindDashboard();
    dashBound = true;
  }
  loadAll();
  startLive();
}

/** Polling ringan untuk memperbarui statistik & daftar secara berkala. */
function startLive() {
  if (liveTimer) clearInterval(liveTimer);
  liveTimer = setInterval(refreshLive, 15000);
  updateLiveIndicator(true);
}

function stopLive() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  updateLiveIndicator(false);
}

function updateLiveIndicator(on) {
  const el = $('#liveIndicator');
  if (!el) return;
  el.classList.toggle('off', !on);
  el.lastChild.textContent = on ? ' Live' : ' Nonaktif';
}

async function refreshLive() {
  try {
    await Promise.all([loadSummary(), loadRsvp(), loadWishes(), loadGuests()]);
  } catch (e) {
    if (e.status === 401) { sessionStorage.removeItem('wedding_admin_pw'); location.reload(); }
  }
}

/* Pasang semua event dashboard. Dipanggil sekali, SETELAH markup dashboard
   disuntikkan ke DOM oleh enterDashboard(). */
function bindDashboard() {
$('#liveToggle').addEventListener('change', (e) => {
  if (e.target.checked) startLive(); else stopLive();
});
$('#logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('wedding_admin_pw');
  location.reload();
});
$('#czBase').addEventListener('change', () => fillCustomizerFromBase($('#czBase').value));
document.querySelectorAll('.cz-grid [data-token]').forEach((el) => {
  el.addEventListener('input', updateCzPreview);
  el.addEventListener('change', updateCzPreview);
});
$('#bgDesktop').addEventListener('input', (e) => updateBgThumb('#bgDesktopThumb', e.target.value.trim()));
$('#bgMobile').addEventListener('input', (e) => updateBgThumb('#bgMobileThumb', e.target.value.trim()));
$('#bgDesktopFile').addEventListener('change', (e) => { uploadBgImage(e.target.files[0], '#bgDesktop', '#bgDesktopThumb', '#bgDesktopLabel'); e.target.value = ''; });
$('#bgMobileFile').addEventListener('change', (e) => { uploadBgImage(e.target.files[0], '#bgMobile', '#bgMobileThumb', '#bgMobileLabel'); e.target.value = ''; });
$('#musicFile').addEventListener('change', onMusicFileChange);
$('#addGuest').addEventListener('click', onAddGuest);
$('#saveAll').addEventListener('click', onSaveAll);
$('#czSaveNew').addEventListener('click', onSaveNewTheme);
document.querySelectorAll('.tab').forEach((t) => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach((x) => x.classList.remove('active'));
    t.classList.add('active');
    $('#panel-' + t.dataset.tab).classList.add('active');
  });
});
document.querySelectorAll('#themePicker input[name="theme"]').forEach((r) => {
  r.addEventListener('change', () => renderCustomThemes());
});
$('#exportRsvp').addEventListener('click', () => downloadCSV('/api/admin/export/rsvp.csv', 'rsvp.csv'));
$('#exportGuests').addEventListener('click', () => downloadCSV('/api/admin/export/guests.csv', 'tamu.csv'));
$('#exportWishes').addEventListener('click', () => downloadCSV('/api/admin/export/wishes.csv', 'ucapan.csv'));
}

async function loadAll() {
  try {
    await Promise.all([loadSummary(), loadRsvp(), loadGuests(), loadWishes(), loadCouple(), loadCustomThemes()]);
    fillCustomizerFromBase($('#czBase').value);
  } catch (e) {
    if (e.status === 401) { sessionStorage.removeItem('wedding_admin_pw'); location.reload(); }
    else toast('Error: ' + e.message);
  }
}

async function loadSummary() {
  const { totals, byAttendance } = await api('/api/admin/summary');
  const map = Object.fromEntries(byAttendance.map(b => [b.attendance, b]));
  $('#stats').innerHTML = `
    <div class="stat"><div class="n">${totals.guests}</div><div class="l">Tamu Diundang</div></div>
    <div class="stat"><div class="n">${totals.rsvp}</div><div class="l">Total RSVP</div></div>
    <div class="stat"><div class="n">${totals.pax_hadir}</div><div class="l">Perkiraan Hadir</div></div>
    <div class="stat"><div class="n">${totals.wishes}</div><div class="l">Ucapan</div></div>`;
}

async function loadRsvp() {
  const rows = await api('/api/admin/rsvp');
  $('#rsvpTable').innerHTML = rows.length ? `
    <table><thead><tr><th>Nama</th><th>Status</th><th>Jml</th><th>Pesan</th><th>Waktu</th></tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td><strong>${esc(r.name)}</strong></td>
      <td><span class="badge ${r.attendance}">${r.attendance==='hadir'?'Hadir':r.attendance==='ragu'?'Ragu':'Tidak Hadir'}</span></td>
      <td>${r.pax||0}</td>
      <td class="wrap-cell">${esc(r.message||'-')}</td>

/* =====================================================================
   TEMA KUSTOM — customizer + daftar tema milik client
   ===================================================================== */

const CZ_DEFAULT = {
  botanical: { '--sage': '#7d8f6d', '--sage-dark': '#57684a', '--gold': '#b08d47', '--cream': '#f7f4ec', '--surface': '#ffffff', '--ink': '#33352e', '--serif': "'Cormorant Garamond', Georgia, serif", '--script': "'Great Vibes', cursive" },
  midnight:  { '--sage': '#8a7f52', '--sage-dark': '#c9a86a', '--gold': '#d8b978', '--cream': '#14131a', '--surface': '#201e2a', '--ink': '#f2ece0', '--serif': "'Playfair Display', Georgia, serif", '--script': "'Great Vibes', cursive" },
  blush:     { '--sage': '#c98a86', '--sage-dark': '#a35e5a', '--gold': '#cb9a7a', '--cream': '#fdf4f1', '--surface': '#fffafa', '--ink': '#3d2f2c', '--serif': "'Lora', Georgia, serif", '--script': "'Italianno', cursive" },
  javanese:  { '--sage': '#8a6d3b', '--sage-dark': '#5e4a24', '--gold': '#b07d2b', '--cream': '#f5ecdd', '--surface': '#fffaf1', '--ink': '#3a2c1a', '--serif': "'Marcellus', Georgia, serif", '--script': "'Pinyon Script', cursive" },
  minimal:   { '--sage': '#3f3f46', '--sage-dark': '#18181b', '--gold': '#71717a', '--cream': '#f4f4f5', '--surface': '#ffffff', '--ink': '#1b1b1f', '--serif': "'Space Grotesk', system-ui, sans-serif", '--script': "'Space Grotesk', system-ui, sans-serif" },
  baroque:   { '--sage': '#6d4b6b', '--sage-dark': '#4a2f49', '--gold': '#a9852f', '--cream': '#f6f1e7', '--surface': '#fffdf8', '--ink': '#2f2436', '--serif': "'Cormorant Garamond', Georgia, serif", '--script': "'Tangerine', cursive" },
};

let CUSTOM_THEMES = [];

/** Isi form customizer dengan nilai preset dasar. */
function fillCustomizerFromBase(base) {
  const def = CZ_DEFAULT[base] || CZ_DEFAULT.botanical;
  const map = { czSage: '--sage', czSageDark: '--sage-dark', czGold: '--gold', czCream: '--cream', czSurface: '--surface', czInk: '--ink' };
  Object.entries(map).forEach(([id, tok]) => {
    const el = $('#' + id);
    if (el && def[tok] && /^#/.test(def[tok])) el.value = def[tok];
  });
  if (def['--serif']) $('#czSerif').value = def['--serif'];
  if (def['--script']) $('#czScript').value = def['--script'];
  updateCzPreview();
}

/** Ambil semua token dari form customizer (untuk preview). */
function readCustomizerTokensAll() {
  const t = {};
  document.querySelectorAll('.cz-grid [data-token]').forEach((el) => { if (el.value) t[el.dataset.token] = el.value; });
  return t;
}

/** Perbarui kotak preview tema sesuai pilihan saat ini. */
function updateCzPreview() {
  const pv = $('#czPreview');
  if (!pv) return;
  const tokens = readCustomizerTokensAll();
  const base = $('#czBase').value;
  const def = CZ_DEFAULT[base] || CZ_DEFAULT.botanical;
  const val = (k) => tokens[k] || def[k];
  pv.style.background = val('--cream');
  pv.style.color = val('--ink');
  const ps = $('#czPvScript'), pf = $('#czPvSerif');
  if (ps) { ps.style.fontFamily = val('--script'); ps.style.color = val('--sage-dark'); }
  if (pf) pf.style.fontFamily = val('--serif');
  updateContrast(val('--ink'), val('--cream'));
}

/* Hitung rasio kontras WCAG (perkiraan cepat) & beri peringatan bila teks
   berpotensi sukar dibaca. Ini menjaga user tidak membuat teks tak terbaca
   tanpa sadar — mis. latar hitam + teks hitam. */
function contrastRatio(hex1, hex2) {
  const toRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''));
    if (!m) return null;
    return [0, 2, 4].map((i) => parseInt(m[1].slice(i, i + 2), 16) / 255);
  };
  const lum = (rgb) => {
    const [r, g, b] = rgb.map((c) => (c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const a = toRgb(hex1), b = toRgb(hex2);
  if (!a || !b) return null;
  const l1 = lum(a), l2 = lum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
}

function updateContrast(inkHex, bgHex) {
  const box = $('#czContrast');
  if (!box) return;
  const ratio = contrastRatio(inkHex, bgHex);
  const sw = $('#czContrastSw'), txt = $('#czContrastText');
  if (sw) { sw.style.background = bgHex; sw.style.boxShadow = `inset 0 0 0 2px ${inkHex}`; }
  box.classList.remove('ok', 'warn', 'bad');
  if (ratio == null) { box.classList.add('ok'); if (txt) txt.textContent = 'Kontras teks tidak dapat dihitung.'; return; }
  const r = ratio.toFixed(1);
  if (ratio >= 4.5) { box.classList.add('ok'); if (txt) txt.textContent = `Kontras teks aman (rasio ${r}:1).`; }
  else if (ratio >= 3) { box.classList.add('warn'); if (txt) txt.textContent = `Kontras agak rendah (rasio ${r}:1). Teks kecil mungkin sukar dibaca — pertimbangkan pertegas warna teks/latar.`; }
  else { box.classList.add('bad'); if (txt) txt.textContent = `Kontras terlalu rendah (rasio ${r}:1). Teks akan sukar dibaca — ubah warna teks atau latar.`; }
}

/** Render daftar tema kustom milik client. */
function renderCustomThemes() {
  const box = $('#customThemes');
  if (!box) return;
  if (!CUSTOM_THEMES.length) { box.innerHTML = ''; return; }
  const activeTheme = (document.querySelector('#themePicker input[name="theme"]:checked') || {}).value || '';
  box.innerHTML = CUSTOM_THEMES.map((t) => {
    const tk = t.tokens || {};
    const a = tk['--sage'] || '#7d8f6d';
    const b = tk['--gold'] || '#b08d47';
    return `<div class="ct-item${t.slug === activeTheme ? ' active' : ''}" data-ct="${t.id}">
      <span class="ct-swatch" style="background:linear-gradient(135deg,${esc(a)} 0 50%,${esc(b)} 50% 100%)"></span>
      <span class="ct-meta">
        <strong>${esc(t.name)}</strong>
        <small>dari tema ${esc(t.base)}</small>
        <span class="ct-actions">
          <button class="ct-btn use" data-use="${t.id}">Pakai</button>
          <button class="ct-btn" data-edit="${t.id}">Edit</button>
          <button class="ct-btn del" data-ctdel="${t.id}">Hapus</button>
        </span>
      </span>
    </div>`;
  }).join('');
}

async function loadCustomThemes() {
  try {
    CUSTOM_THEMES = await api('/api/admin/themes');
    renderCustomThemes();
  } catch (e) { /* diamkan */ }
}

/* Simpan tema baru — dipanggil dari bindDashboard */
async function onSaveNewTheme() {
  const name = $('#czName').value.trim();
  if (!name) return toast('Beri nama tema Anda dulu.');
  try {
    const tokens = readCustomizerTokensAll();
    const res = await api('/api/admin/themes', { method: 'POST', body: JSON.stringify({ name, base: $('#czBase').value, tokens }) });
    toast('Tema "' + name + '" disimpan ✓');
    $('#czName').value = '';
    await loadCustomThemes();
    // langsung terapkan tema baru
    await api('/api/admin/themes/' + res.id + '/activate', { method: 'POST' });
    toast('Tema baru diterapkan ke undangan ✓');
    loadCouple();
  } catch (e) { toast(e.message); }
}

/* aksi pada daftar tema kustom */
document.addEventListener('click', async (e) => {
  const use = e.target.closest('[data-use]');
  if (use) {
    await api('/api/admin/themes/' + use.dataset.use + '/activate', { method: 'POST' });
    toast('Tema diterapkan ✓'); loadCouple(); return;
  }
  const ed = e.target.closest('[data-edit]');
  if (ed) {
    const t = CUSTOM_THEMES.find((x) => String(x.id) === ed.dataset.edit);
    if (!t) return;
    $('#czBase').value = t.base || 'botanical';
    const tk = t.tokens || {};
    document.querySelectorAll('.cz-grid [data-token]').forEach((el) => {
      if (tk[el.dataset.token]) el.value = tk[el.dataset.token];
    });
    $('#czName').value = t.name;
    updateCzPreview();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    toast('Tema dimuat ke editor. Ubah lalu simpan (akan buat tema baru).');
    return;
  }
  const dl = e.target.closest('[data-ctdel]');
  if (dl) {
    if (!confirm('Hapus tema ini?')) return;
    await api('/api/admin/themes/' + dl.dataset.ctdel, { method: 'DELETE' });
    toast('Tema dihapus'); loadCustomThemes(); return;
  }
});

/* ---------- UPLOAD GAMBAR LATAR ---------- */
// Perbarui pratinjau gambar latar (thumbnail kecil di bawah input).
function updateBgThumb(sel, url) {
  const el = $(sel);
  if (!el) return;
  if (url) { el.style.backgroundImage = `url("${String(url).replace(/["()]/g, '')}")`; el.classList.add('show'); }
  else { el.style.backgroundImage = ''; el.classList.remove('show'); }
}

/* Pratinjau gambar latar diperbarui otomatis lewat bindDashboard(). */

async function uploadBgImage(file, inputSel, thumbSel, labelSel) {
  if (!file) return;
  const label = $(labelSel);
  const fd = new FormData();
  fd.append('file', file);
  const prev = label.textContent;
  label.textContent = 'Mengunggah…';
  label.parentElement.classList.add('busy');
  try {
    const res = await fetch('/api/admin/upload/image', {
      method: 'POST', headers: { 'x-admin-password': PW, 'x-account': SLUG }, body: fd,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal mengunggah');
    $(inputSel).value = data.url;
    updateBgThumb(thumbSel, data.url);
    toast('Gambar diunggah ✓ Jangan lupa Simpan Perubahan.');
  } catch (err) { toast(err.message); }
  finally { label.textContent = prev; label.parentElement.classList.remove('busy'); }
}

/* ---------- UPLOAD MUSIK ---------- */
async function onMusicFileChange(e) {
  const file = e.target.files[0];
  if (!file) return;
  const label = $('#musicUploadLabel');
  const fd = new FormData();
  fd.append('file', file);
  label.textContent = 'Mengunggah…';
  label.parentElement.classList.add('busy');
  try {
    const res = await fetch('/api/admin/upload/music', {
      method: 'POST',
      headers: { 'x-admin-password': PW, 'x-account': SLUG },
      body: fd,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal mengunggah');
    $('#sMusic').value = data.url;
    const pv = $('#musicPreview');
    pv.src = data.url; pv.hidden = false;
    toast('Musik berhasil diunggah ✓');
  } catch (err) {
    toast(err.message);
  } finally {
    label.textContent = 'Unggah';
    label.parentElement.classList.remove('busy');
    e.target.value = '';
  }
}

/* ---------- EXPORT CSV ---------- */
async function downloadCSV(url, filename) {
  try {
    const res = await fetch(url, { headers: { 'x-admin-password': PW, 'x-account': SLUG } });
    if (!res.ok) throw new Error('Gagal mengunduh (' + res.status + ')');
    const blob = await res.blob();
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
    toast('Berhasil mengunduh ' + filename + ' ✓');
  } catch (e) { toast(e.message); }
}
